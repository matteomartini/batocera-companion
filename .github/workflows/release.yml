name: Release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis zip
      - name: Build installer
        run: ./build.sh
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Batocera Companion ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/BatoceraCompanion-Setup-*.zip
